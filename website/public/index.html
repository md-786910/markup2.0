      }
    </script>

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Markly",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://feedbackly.online",
        "description": "Visual feedback tool that lets teams pin comments directly on websites, PDFs, and launch assets. Real-time collaboration with guest review links.",
        "offers": [
          {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD",
            "name": "Free",
            "description": "3 projects, 5 team members, 2 guests - free forever"
          },
          {
            "@type": "Offer",
            "price": "12",
            "priceCurrency": "USD",
            "name": "Starter",
            "description": "15 projects, 25 team members, 10 guests, Slack integration"
          },
          {
            "@type": "Offer",
            "price": "29",
            "priceCurrency": "USD",
            "name": "Pro",
            "description": "Unlimited projects and members, Slack, Jira & Discord, version history"
          }
        ]
      }
    </script>

    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is Markly a free alternative to Markup.io?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Markly offers a free forever plan with 3 projects, 5 team members, and 2 guest reviewers. Paid plans start at $12/month compared to Markup.io's $39/month starting price. You get real-time collaboration, guest review links, and integrations with Slack, Discord, and Jira."
            }
          },
          {
            "@type": "Question",
            "name": "How does visual feedback work on a live website?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Add your website URL to Markly and it loads inside the review environment. Click anywhere on the page to drop a feedback pin. Each pin is anchored to the exact element, so feedback stays precise even when the page layout changes. Your team sees pins in real time."
            }
          },
          {
            "@type": "Question",
            "name": "Can clients leave feedback without creating an account?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Absolutely. Generate a password-protected guest review link and share it with clients. They can view the project, drop feedback pins, and leave comments with no signup required. You control access with passwords and expiration dates."
            }
          },
          {
            "@type": "Question",
            "name": "Does Markly work with PDFs and design files?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Upload PDFs and multipage documents directly to Markly. Navigate pages, drop feedback pins, and collaborate with threaded comments using the same workflow as website review."
            }
          },
          {
            "@type": "Question",
            "name": "What integrations does Markly support?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Markly integrates with Slack, Discord, and Jira. Get instant notifications when feedback is posted, and create Jira issues directly from feedback pins."
            }
          },
          {
            "@type": "Question",
            "name": "How is Markly different from BugHerd or Pastel?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Markly combines visual pin-based feedback, real-time collaboration, and guest review links. It also includes PDF review, device mode preview, and a free forever plan."
            }
          }
        ]
      }
    </script>
