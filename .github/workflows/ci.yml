name: CI Pipeline

on:
  push:
    branches: [ master, develop, bug-report ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Run Test Suites & Verification
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379

    env:
      # Test scripts read TEST_MONGODB_URI; the database name must end in _test (it is dropped)
      TEST_MONGODB_URI: mongodb://localhost:27017/kommently_ci_test
      JWT_SECRET: ci-secret-key-must-be-long-enough-for-sha256-hash
      ADMIN_REQUIRE_2FA: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Same major version as the Docker images (deploy/docker)
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            admin/package-lock.json

      - name: Install Server Dependencies
        run: npm --prefix server ci

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Install Admin Dependencies
        run: npm --prefix admin ci

      - name: Run server tests (smoke + email links, with Redis)
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
        run: npm --prefix server test

      - name: Run phase tests
        working-directory: server
        run: |
          for t in phase3DeveloperReports phase4Approvals phase5Health phase6Revenue phase7Hardening phase8Workflow globalTrialSettings; do
            echo "::group::$t"
            node test/$t.js
            echo "::endgroup::"
          done

      # CRA treats warnings as errors when CI=true, and its ESLint config needs
      # DISABLE_ESLINT_PLUGIN (see CLAUDE.md)
      - name: Build Client Web App
        env:
          CI: false
          DISABLE_ESLINT_PLUGIN: true
        run: npm --prefix client run build

      - name: Build Admin Portal
        env:
          CI: false
          DISABLE_ESLINT_PLUGIN: true
        run: npm --prefix admin run build
