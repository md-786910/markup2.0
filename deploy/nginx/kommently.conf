# Kommently on the host's nginx.
#   api.               -> the API container (API_PORT in .env)
#   app., admin., site -> {client,admin,website}/build in the repo, published
#                         by `docker compose up -d --build`
# The port and repo path come from .env via deploy/nginx/apply-env.sh, which
# writes /etc/nginx/conf.d/kommently-env.conf; this file never needs editing.
#
# Install (from the repo root):
#   sudo chmod o+x /root /root/markup2.0     # nginx must enter the repo folder
#   sudo cp deploy/nginx/kommently.conf /etc/nginx/sites-available/kommently.conf
#   sudo ln -sf /etc/nginx/sites-available/kommently.conf /etc/nginx/sites-enabled/
#   sudo sh deploy/nginx/apply-env.sh
#   sudo certbot --nginx -d kommently.info -d www.kommently.info \
#     -d app.kommently.info -d admin.kommently.info -d api.kommently.info
# Certbot adds the HTTPS listeners and renews certificates automatically.
# Changed API_PORT later? Only: sudo sh deploy/nginx/apply-env.sh

# WebSocket upgrade for live updates (socket.io)
map $http_upgrade $kommently_connection {
    default upgrade;
    ''      close;
}

# API: the whole host goes to the server (the website proxy needs every path,
# not only /api), including WebSocket upgrades and large uploads.
server {
    listen 80;
    server_name api.kommently.info;

    client_max_body_size 250m;

    location / {
        proxy_pass http://kommently_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kommently_connection;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name app.kommently.info;
    root $kommently_repo/client/build;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build files never change: cache for a year
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Everything else: always revalidate; unknown paths go to the app router
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}

server {
    listen 80;
    server_name admin.kommently.info;
    root $kommently_repo/admin/build;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build files never change: cache for a year
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Everything else: always revalidate; unknown paths go to the app router
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}

server {
    listen 80;
    server_name kommently.info www.kommently.info;
    root $kommently_repo/website/build;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build files never change: cache for a year
