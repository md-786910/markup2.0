# Kommently on the host's nginx.
#   api.               -> the API container (API_PORT in .env)
#   app., admin., site -> {client,admin,website}/build in the repo, published
#                         by `docker compose up -d --build`
# The port, repo path and the origins used in the CSP headers (API_URL,
# POSTHOG_HOST) come from .env via deploy/nginx/apply-env.sh, which writes
# /etc/nginx/conf.d/kommently-env.conf; this file never needs editing.
#
# Install (from the repo root):
#   sudo chmod o+x /root /root/markup2.0     # nginx must enter the repo folder
#   sudo cp deploy/nginx/kommently.conf /etc/nginx/sites-available/kommently.conf
#   sudo ln -sf /etc/nginx/sites-available/kommently.conf /etc/nginx/sites-enabled/
#   sudo sh deploy/nginx/apply-env.sh
#   sudo certbot --nginx -d kommently.info -d www.kommently.info \
#     -d app.kommently.info -d admin.kommently.info -d api.kommently.info
# Certbot adds the HTTPS listeners and renews certificates automatically.
# Changed API_PORT/API_URL/POSTHOG_HOST later, or copied a new version of this
# file? Run: sudo sh deploy/nginx/apply-env.sh (this file uses the variables it
# writes, so `nginx -t` fails until it has run once).
#
# This file is included in the http context (sites-enabled), so the map and
# limit_req_zone below are valid here.
#
# Headers: nginx's add_header is inherited from the server block only by
# locations that have no add_header of their own. The frontend locations
# therefore set none: every header, Cache-Control included (via the map
# below), is set once per server block and reaches index.html, the hashed
# /static/ files and the other public files alike.
# After changing a CSP, check the browser console for "Content-Security-Policy"
# violations on each app (sign-in, project with a website and a PDF, billing
# checkout, support chat; on the website the cookie banner and chat).

# WebSocket upgrade for live updates (socket.io)
map $http_upgrade $kommently_connection {
    default upgrade;
    ''      close;
}

# Hashed build files never change: cache for a year; everything else revalidates
map $uri $kommently_cache_control {
    ~^/static/ "public, max-age=31536000, immutable";
    default    "no-cache";
}

# Per-IP request rate for the API host. Generous: a proxied review page loads
# all its assets through the API (often 100+ requests at once). The API has its
# own per-route limits (express-rate-limit) behind this.
limit_req_zone $binary_remote_addr zone=kommently_api:10m rate=30r/s;

# API: the whole host goes to the server (the website proxy needs every path,
# not only /api), including WebSocket upgrades and uploads. The API sets its
# own security headers (helmet).
server {
    listen 80;
    server_tokens off;
    server_name api.kommently.info;

    # Up to 100 requests over the rate pass at once (the first 100 without
    # delay), the next 100 are queued; beyond that 429
    limit_req zone=kommently_api burst=200 delay=100;
    limit_req_status 429;

    # Body limits follow the server's own: JSON 1 MB, /api/proxy 10 MB (form
    # posts of reviewed sites), avatar/logo/screenshot 5 MB
    client_max_body_size 12m;

    # Inherited by every location below (none sets its own)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $kommently_connection;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;

    # New document project: up to 10 documents of 20 MB (uploadDocument.js)
    location = /api/projects {
        client_max_body_size 210m;
        proxy_pass http://kommently_api;
    }

    # Comment attachments (team and guest): up to 5 files of 20 MB
    location ~ ^/api/(pins/[^/]+|guest/[^/]+/pins/[^/]+)/comments$ {
        client_max_body_size 105m;
        proxy_pass http://kommently_api;
    }

    # Support tickets and replies: up to 3 attachments of 5 MB
    location ~ ^/api/support/tickets(/[^/]+/messages)?$ {
        client_max_body_size 20m;
        proxy_pass http://kommently_api;
    }

    location / {
        proxy_pass http://kommently_api;
    }
}

# App (client/). Loads: the API (REST, socket.io over wss, /uploads images and
# PDFs, the review iframe /api/proxy), Google Fonts, Sentry ingest, PostHog
# (scripts and events), Crisp chat (only when opened), PayPal and Razorpay
# checkout (billing/onboarding), project thumbnails from mshots (wp.com) and
# microlink. pdf.js runs its worker from our own build.
server {
    listen 80;
    server_tokens off;
    server_name app.kommently.info;
    root $kommently_repo/client/build;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $kommently_cache_control;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.paypal.com https://*.paypal.com https://*.paypalobjects.com https://checkout.razorpay.com https://client.crisp.chat https://settings.crisp.chat https://*.posthog.com $kommently_posthog_origin; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://client.crisp.chat https://*.paypal.com; font-src 'self' data: https://fonts.gstatic.com https://client.crisp.chat; img-src 'self' data: blob: $kommently_api_origin https://*.wp.com https://*.microlink.io https://*.paypal.com https://*.paypalobjects.com https://*.razorpay.com https://client.crisp.chat https://image.crisp.chat https://storage.crisp.chat https://*.posthog.com; media-src 'self' blob: $kommently_api_origin https://client.crisp.chat; connect-src 'self' data: blob: $kommently_api_origin $kommently_api_ws https://*.sentry.io https://*.posthog.com $kommently_posthog_origin https://*.paypal.com https://*.paypalobjects.com https://*.razorpay.com https://client.crisp.chat https://storage.crisp.chat wss://client.relay.crisp.chat wss://stream.relay.crisp.chat; frame-src $kommently_api_origin https://*.paypal.com https://*.paypalobjects.com https://*.razorpay.com https://game.crisp.chat; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://*.paypal.com https://*.razorpay.com; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), browsing-topics=(), payment=(self \"https://www.paypal.com\" \"https://api.razorpay.com\" \"https://checkout.razorpay.com\")" always;
    # PayPal and Razorpay open popups that talk back to this window
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;

    location /static/ {
        # The pdf.js worker (static/media/pdf.worker.*.mjs) is a module worker:
        # browsers refuse it unless it is served as JavaScript, and older
        # nginx mime.types have no .mjs entry
        location ~ \.mjs$ {
            types { text/javascript mjs; }
            try_files $uri =404;
        }
        try_files $uri =404;
    }

    # Unknown paths go to the app router
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}

# Admin panel (admin/): only our own files, the API and Google Fonts.
server {
    listen 80;
    server_tokens off;
    server_name admin.kommently.info;
    root $kommently_repo/admin/build;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $kommently_cache_control;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: $kommently_api_origin; connect-src 'self' $kommently_api_origin; frame-src 'none'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), browsing-topics=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    location /static/ {
        try_files $uri =404;
    }

    # Unknown paths go to the app router
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}

# Marketing site (website/). Loads: the API (/api/plans, contact form), Google
# Fonts, Crisp chat (only when opened) and Google Analytics (gtag.js, only
# after analytics consent in the cookie banner).
server {
    listen 80;
    server_tokens off;
    server_name kommently.info www.kommently.info;
    root $kommently_repo/website/build;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $kommently_cache_control;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.googletagmanager.com https://client.crisp.chat https://settings.crisp.chat; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://client.crisp.chat; font-src 'self' data: https://fonts.gstatic.com https://client.crisp.chat; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com https://client.crisp.chat https://image.crisp.chat https://storage.crisp.chat; media-src 'self' https://client.crisp.chat; connect-src 'self' $kommently_api_origin https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://client.crisp.chat https://storage.crisp.chat wss://client.relay.crisp.chat wss://stream.relay.crisp.chat; frame-src https://game.crisp.chat; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), browsing-topics=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    location /static/ {
        try_files $uri =404;
    }

    # Unknown paths go to the app router
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
