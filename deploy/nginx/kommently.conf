# Kommently on the host's nginx.
#   api.    -> the API container on 127.0.0.1:5000
#   app., admin., site -> static files that `docker compose up -d --build`
#   publishes to {client,admin,website}/build in the repo (/root/markup2.0)
#   nginx (www-data) must be able to enter the folders above it, once:
#     sudo chmod o+x /root /root/markup2.0
#
# Install:
#   sudo cp deploy/nginx/kommently.conf /etc/nginx/sites-available/kommently.conf
#   sudo ln -s /etc/nginx/sites-available/kommently.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d kommently.info -d www.kommently.info \
#     -d app.kommently.info -d admin.kommently.info -d api.kommently.info
# Certbot adds the HTTPS listeners and renews certificates automatically.
# For another domain, replace kommently.info below.

# WebSocket upgrade for live updates (socket.io)
map $http_upgrade $kommently_connection {
    default upgrade;
    ''      close;
}

# API: the whole host goes to the server (the website proxy needs every path,
# not only /api), including WebSocket upgrades and large uploads.
server {
    listen 80;
    server_name api.kommently.info;

    client_max_body_size 250m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kommently_connection;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name app.kommently.info;
    root /root/markup2.0/client/build;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build files never change: cache for a year
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Everything else: always revalidate; unknown paths go to the app router
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}

server {
    listen 80;
    server_name admin.kommently.info;
    root /root/markup2.0/admin/build;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build files never change: cache for a year
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
