# Serves a React single-page app. TLS and host routing are done by the edge
# proxy (deploy/Caddyfile) or your own nginx in front of this container.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # add_header is not inherited into locations that set their own, so the
  # security headers are repeated wherever Cache-Control is added.
  set $nosniff "nosniff";

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Hashed build assets never change
  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options $nosniff always;
    try_files $uri =404;
  }

  # The HTML shell must always be revalidated so deploys take effect at once
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options $nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Prerendered pages (website SEO build) first, then the SPA shell
    try_files $uri $uri.html $uri/index.html /index.html;
  }
}
