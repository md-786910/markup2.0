# Kommently on one host. Settings come from the single .env in this folder.
#   cp .env.example .env && (edit) && docker compose up -d --build
#
# Only Caddy (80/443) is public. Mongo and Redis are on a private network and
# bound to 127.0.0.1 for admin access over an SSH tunnel.

name: kommently

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-web: &web
  <<: *defaults
  networks: [edge]
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
    interval: 30s
    timeout: 3s
    retries: 3

services:
  mongo:
    <<: *defaults
    image: mongo:7.0
    command: ["--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB=1"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env}
      MONGO_APP_DB: markup_mvp
      MONGO_APP_USER: kommently
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set in .env}
    volumes:
      - mongo-data:/data/db
      - ./deploy/mongo-init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${MONGO_PORT:-27017}:27017"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    <<: *defaults
    image: redis:7.4-alpine
    # appendonly: queued jobs survive restarts; noeviction: queue keys are never dropped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Weekly AES-256 encrypted backup of Mongo + uploads into deploy/backups
  backup:
    <<: *defaults
    image: mongo:7.0
    entrypoint: ["/bin/bash", "/backup/backup-loop.sh"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set in .env}
    volumes:
      - ./deploy/backup:/backup:ro
      - ./deploy/backups:/backups
      - uploads:/uploads:ro
    networks: [backend]

  server:
    <<: *defaults
    image: kommently/server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/docker/server.Dockerfile
    init: true
    stop_grace_period: 20s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Everything from .env; inside Docker the database and Redis are reached
    # by service name, so those two addresses are set here.
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGODB_URI: mongodb://kommently:${MONGO_APP_PASSWORD}@mongo:27017/markup_mvp?authSource=markup_mvp
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BILLING_CRON_ENABLED: "true"
      # Not needed by the API; kept out of its environment
      MONGO_ROOT_PASSWORD: ""
      BACKUP_PASSPHRASE: ""
    volumes:
      - uploads:/app/uploads
    networks: [backend, edge]

  client:
    <<: *web
    image: kommently/client:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/docker/spa.Dockerfile
      args:
        APP_DIR: client
        REACT_APP_BASE_URL: ${API_URL}/api
        REACT_APP_SERVER_URL: ${API_URL}
        REACT_APP_SENTRY_DSN: ${CLIENT_SENTRY_DSN:-}

  admin:
    <<: *web
    image: kommently/admin:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/docker/spa.Dockerfile
      args:
        APP_DIR: admin
        REACT_APP_BASE_URL: ${API_URL}/api
        REACT_APP_SERVER_URL: ${API_URL}

  website:
    <<: *web
    image: kommently/website:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/docker/spa.Dockerfile
      args:
        APP_DIR: website
        REACT_APP_API_URL: ${API_URL}
        REACT_APP_APP_URL: ${APP_URL}
        REACT_APP_SITE_URL: ${SITE_URL}

  # HTTPS (automatic certificates) + routing each domain to its app
  caddy:
    <<: *defaults
    image: caddy:2.8-alpine
    depends_on:
      server:
        condition: service_healthy
    environment:
      API_URL: ${API_URL:?set in .env}
      APP_URL: ${APP_URL:?set in .env}
      ADMIN_URL: ${ADMIN_URL:?set in .env}
      SITE_URL: ${SITE_URL:?set in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports: ["80:80", "443:443", "443:443/udp"]
    networks: [edge]

volumes:
  mongo-data:
  redis-data:
  uploads:
  caddy-data:

networks:
  backend:
  edge:
