# Kommently with Docker Compose. Settings come from the single .env in this folder.
#
# This file runs everything in DEVELOPMENT mode: source folders are mounted
# and the API (nodemon) and the frontends (React dev servers) reload when you
# save a file. docker-compose.override.yml (loaded automatically) turns the
# same services into PRODUCTION builds; on a local machine, comment out the
# services in the override to keep them in dev mode.
#
#   cp .env.example .env && (edit) && docker compose up -d --build
#
# Ports, all on 127.0.0.1: API :5000, app :8081, admin :8082, website :8083.
# On the server, nginx serves the domains (deploy/nginx/kommently.conf).
# Mongo and Redis are on a private network, bound to 127.0.0.1 for admin
# access over an SSH tunnel.

name: kommently

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# Development containers: plain Node with the app's folder mounted.
# Dependencies live in a volume per app and are reinstalled when
# package-lock.json changes.
x-dev-node: &dev-node
  <<: *defaults
  image: node:22-bookworm-slim
  working_dir: /app
  init: true

x-install: &install
  "cmp -s package-lock.json node_modules/.installed-lock 2>/dev/null || { npm ci --no-audit --no-fund && cp package-lock.json node_modules/.installed-lock; }"

services:
  mongo:
    <<: *defaults
    image: mongo:7.0
    command: ["--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB=1"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env}
      MONGO_APP_DB: markup_mvp
      MONGO_APP_USER: kommently
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set in .env}
    volumes:
      - mongo-data:/data/db
      - ./deploy/mongo-init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${MONGO_PORT:-27017}:27017"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    <<: *defaults
    image: redis:7.4-alpine
    # appendonly: queued jobs survive restarts; noeviction: queue keys are never dropped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Weekly AES-256 encrypted backup of Mongo + uploads into deploy/backups
  backup:
    <<: *defaults
    image: mongo:7.0
    entrypoint: ["/bin/bash", "/backup/backup-loop.sh"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set in .env}
    volumes:
      - ./deploy/backup:/backup:ro
      - ./deploy/backups:/backups
      - uploads:/uploads:ro
    networks: [backend]

  server:
    <<: *dev-node
    command: ["sh", "-c", "eval \"$$INSTALL\" && npm run dev"]
    stop_grace_period: 20s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Everything from .env; inside Docker the database and Redis are reached
    # by service name, so those two addresses are set here.
    env_file: .env
    environment:
      INSTALL: *install
      NODE_ENV: development
      PORT: "5000"
      MONGODB_URI: mongodb://kommently:${MONGO_APP_PASSWORD}@mongo:27017/markup_mvp?authSource=markup_mvp
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BILLING_CRON_ENABLED: "false"
      WEB_CONCURRENCY: "1"
      PROXY_ALLOW_PRIVATE: "true"
      # Not needed by the API; kept out of its environment
      MONGO_ROOT_PASSWORD: ""
      BACKUP_PASSPHRASE: ""
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
      - uploads:/app/uploads
    ports: ["127.0.0.1:${API_PORT:-5000}:5000"]
    networks: [backend, edge]

  client:
    <<: *dev-node
    command: ["sh", "-c", "eval \"$$INSTALL\" && npm start"]
    environment:
      INSTALL: *install
      PORT: "3000"
      BROWSER: none
      DISABLE_ESLINT_PLUGIN: "true"
      REACT_APP_BASE_URL: ${API_URL}/api
      REACT_APP_SERVER_URL: ${API_URL}
      REACT_APP_SENTRY_DSN: ${CLIENT_SENTRY_DSN:-}
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    ports: ["127.0.0.1:${APP_PORT:-8081}:3000"]
    networks: [edge]

  admin:
    <<: *dev-node
    command: ["sh", "-c", "eval \"$$INSTALL\" && npm start"]
    environment:
      INSTALL: *install
      PORT: "3000"
      BROWSER: none
      DISABLE_ESLINT_PLUGIN: "true"
      REACT_APP_BASE_URL: ${API_URL}/api
      REACT_APP_SERVER_URL: ${API_URL}
    volumes:
      - ./admin:/app
      - admin-node-modules:/app/node_modules
    ports: ["127.0.0.1:${ADMIN_PORT:-8082}:3000"]
    networks: [edge]

  website:
    <<: *dev-node
    command: ["sh", "-c", "eval \"$$INSTALL\" && npm start"]
    environment:
      INSTALL: *install
      PORT: "3000"
      BROWSER: none
      DISABLE_ESLINT_PLUGIN: "true"
      REACT_APP_API_URL: ${API_URL}
      REACT_APP_APP_URL: ${APP_URL}
      REACT_APP_SITE_URL: ${SITE_URL}
    volumes:
      - ./website:/app
      - website-node-modules:/app/node_modules
    ports: ["127.0.0.1:${SITE_PORT:-8083}:3000"]
    networks: [edge]

volumes:
  mongo-data:
  redis-data:
  uploads:
  # Dev-mode dependencies (kept separate from node_modules on your machine)
  server-node-modules:
  client-node-modules:
  admin-node-modules:
  website-node-modules:

networks:
  backend:
  edge:
